[project]
name = "podman-manager"
version = "0.1.0"
description = "Comprehensive Python-based container management tool for Podman with rich terminal UI, health monitoring, and compose file integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "loguru>=0.7.0",
    "requests>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=7.2.0",
    "mypy>=1.0.0"
]

[tool.pyright]
reportPossiblyUnboundVariable = false
